name: Keep Supabase awake

# Supabase pauses free-plan projects after a week without activity, and Let's Connect bookings would then
# fail. This calls the public "taken slots" lookup twice a week, which counts as activity. It only reads
# booked call times (never who booked), with the same public key the website already ships in .env.
# Run it by hand from the Actions tab to check it works.

on:
  schedule:
    - cron: '17 3 * * 1,4' # 03:17 UTC (08:47 IST) every Monday and Thursday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false

      - name: Ask Supabase for taken call times
        env:
          # Optional overrides, if .env ever stops being committed: repository variable SUPABASE_URL and
          # secret SUPABASE_PUBLISHABLE_KEY.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          from_env() { grep -E "^$1=" .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '\r'; }
          url="${SUPABASE_URL:-$(from_env VITE_SUPABASE_URL)}"
          key="${SUPABASE_KEY:-$(from_env VITE_SUPABASE_PUBLISHABLE_KEY)}"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::No Supabase URL or publishable key found in .env (or in the SUPABASE_URL variable / SUPABASE_PUBLISHABLE_KEY secret)."
            exit 1
          fi
          from=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          to=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 \
            -X POST "${url%/}/rest/v1/rpc/taken_slots" \
            -H "apikey: $key" \
            -H 'Content-Type: application/json' \
            -d "{\"from_time\":\"$from\",\"to_time\":\"$to\"}")
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            echo "::error::Supabase didn't answer normally. If the project is paused, restore it from the Supabase dashboard."
            exit 1
          fi
