name: Keep Supabase awake

# Supabase pauses free-plan projects after a week without activity, and Let's Connect bookings would then
# fail. This calls the public "taken slots" lookup twice a week, which counts as activity. It only reads
# booked call times (never who booked), with the same public key the website ships.
# Needs, in the repository's Settings -> Secrets and variables -> Actions:
#   variable SUPABASE_URL              same value as VITE_SUPABASE_URL in .env
#   secret   SUPABASE_PUBLISHABLE_KEY  same value as VITE_SUPABASE_PUBLISHABLE_KEY in .env
# Run it by hand from the Actions tab to check it works.

on:
  schedule:
    - cron: '17 3 * * 1,4' # 03:17 UTC (08:47 IST) every Monday and Thursday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Supabase for taken call times
        env:
          url: ${{ vars.SUPABASE_URL }}
          key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Add the repository variable SUPABASE_URL and secret SUPABASE_PUBLISHABLE_KEY (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          from=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          to=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 \
            -X POST "${url%/}/rest/v1/rpc/taken_slots" \
            -H "apikey: $key" \
            -H 'Content-Type: application/json' \
            -d "{\"from_time\":\"$from\",\"to_time\":\"$to\"}")
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            echo "::error::Supabase didn't answer normally. If the project is paused, restore it from the Supabase dashboard."
            exit 1
          fi
